name: Build TalaYar Global VIP Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK & AAB (Google Play, CafeBazaar, Myket)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK (Direct Install & Testing)
        working-directory: ./android
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (CafeBazaar & Myket)
        working-directory: ./android
        run: gradle assembleRelease --no-daemon

      - name: Build Release Bundle AAB (Google Play Store)
        working-directory: ./android
        run: gradle bundleRelease --no-daemon

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TalaYar-Global-VIP-Android-Release
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
